name: Build CG50 Games

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['games/**']
  pull_request:
    paths: ['games/**']
  workflow_dispatch:
  # Rebuild the games whenever a new toolchain image has been published
  workflow_run:
    workflows: ['Build fxSDK Toolchain Image']
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/cg50-fxsdk:latest
    strategy:
      matrix:
        game: [tetris] # Add new folder names here as you port more games

    steps:
      - uses: actions/checkout@v4

      - name: Compile ${{ matrix.game }} (.g3a)
        working-directory: games/${{ matrix.game }}
        run: fxsdk build-cg

      - name: Upload .g3a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.game }}-g3a
          path: games/${{ matrix.game }}/*.g3a

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: games/${{ matrix.game }}/*.g3a
