name: Build CG50 Games

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['games/**', 'seasonal/**']
  pull_request:
    paths: ['games/**', 'seasonal/**']
  workflow_dispatch:
  # Rebuild the games whenever a new toolchain image has been published
  workflow_run:
    workflows: ['Build fxSDK Toolchain Image']
    types: [completed]
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/cg50-fxsdk:latest
    strategy:
      fail-fast: false
      matrix:
        # Add a line for each new game or seasonal project.
        # name: what the download is called (no slashes); path: its folder
        include:
          - name: tetris
            path: games/tetris
          - name: heart
            path: seasonal/valentines-day/beating-heart

    steps:
      - uses: actions/checkout@v4

      - name: Compile ${{ matrix.name }} (.g3a)
        working-directory: ${{ matrix.path }}
        run: fxsdk build-cg

      - name: Upload .g3a Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-g3a
          path: ${{ matrix.path }}/*.g3a

      - name: Attach to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.path }}/*.g3a
