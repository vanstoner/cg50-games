
name: Build fxSDK Toolchain Image

on:
  workflow_dispatch:
  push:
    paths:
      - 'docker/Dockerfile'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push toolchain image
        uses: docker/build-push-action@v6
        with:
          context: ./docker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/cg50-fxsdk:latest
